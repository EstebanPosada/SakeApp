name: Enforce Milestone
on:
  pull_request:
    branches-ignore: ["master", "release/**"]
    types: [opened, edited, reopened, synchronize, milestoned, demilestoned]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for Milestone
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const milestone = pr.milestone
            if (!milestone) {
              core.setFailed('PR must have a milestone before merging.')
            } else {
              core.info(`Milestone OK: ${milestone.title}`)
            }